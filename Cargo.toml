[workspace]
members = [
    "apps/tui-rs",
    "apps/server-rs",
    "packages/runtime-rs",
    "packages/sidebar-core-rs",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release-dev]
inherits = "dev"
opt-level = 1
lto = "off"
incremental = true
codegen-units = 256
strip = false
debug = "line-tables-only"
